  <link rel="stylesheet" href="app-styles.css" />
  <link rel="stylesheet" href="screens.css" />

  <!-- shell-specific UI (linear walkthrough): step dots, Next button, loading -->
  <style>
    .shell-steps { display:flex; gap:7px; justify-content:center; padding:10px 0 4px; }
    .shell-dot { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.18); transition:.25s; }
    .shell-dot.on { background:var(--cyan,#00E5FF); box-shadow:0 0 10px var(--cyan,#00E5FF); transform:scale(1.25); }
    .shell-dot.done { background:rgba(255,255,255,.5); }
    .shell-deck { flex:1 1 auto; min-height:0; }
    .shell-foot { padding:12px 18px calc(14px + env(safe-area-inset-bottom)); }
    .shell-next {
      width:100%; border:0; border-radius:16px; padding:18px;
      font:700 16px/1 'Space Grotesk', system-ui, sans-serif; letter-spacing:.06em;
      color:#06121a; cursor:pointer;
      background:linear-gradient(90deg, var(--cyan,#00E5FF), #7ef0ff);
      box-shadow:0 0 24px rgba(0,229,255,.45);
    }
    .shell-next:disabled { background:rgba(255,255,255,.12); color:rgba(255,255,255,.5); box-shadow:none; cursor:default; }
    .shell-next:active:not(:disabled) { transform:translateY(1px); }

    .loading-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; height:100%; gap:10px; }
    .loading-screen .screen-title { margin:0; }
    .ls-orb { position:relative; width:120px; height:120px; margin:18px 0; }
    .ls-orb span {
      position:absolute; inset:0; border-radius:50%; border:3px solid transparent;
      border-top-color:var(--cyan,#00E5FF); border-right-color:var(--magenta,#FF1A8C);
      animation:lsspin 1.1s linear infinite;
    }
    .ls-orb span:nth-child(2) { inset:14px; animation-duration:1.6s; animation-direction:reverse; opacity:.7; }
    .ls-orb span:nth-child(3) { inset:30px; animation-duration:.9s; opacity:.5; }
    @keyframes lsspin { to { transform:rotate(360deg); } }
    .ls-next { display:flex; flex-direction:column; gap:4px; margin-top:8px; }
    .ls-next-k { font:700 11px/1 'JetBrains Mono', monospace; letter-spacing:.22em; color:rgba(255,255,255,.45); }
    .ls-next-name { font:900 30px/1 'Archivo','Space Grotesk',sans-serif; color:var(--cyan,#00E5FF); text-shadow:0 0 18px rgba(0,229,255,.5); }
    .ls-next-genre { font:700 14px/1 'Space Grotesk',sans-serif; letter-spacing:.14em; color:var(--magenta,#FF1A8C); }
    .ls-next-line { font:italic 500 15px/1.3 'Space Grotesk',sans-serif; color:rgba(255,255,255,.8); margin-top:6px; max-width:300px; }

    /* VOTE: two equal genre buttons; each fills vertically with its live vote */
    .shell-deck .deck-pane { height:100%; }
    .votescreen { display:flex; flex-direction:column; height:100%; padding:12px 12px 14px; gap:10px; box-sizing:border-box; }
    .vs-kicker { text-align:center; font:700 12px/1 'JetBrains Mono',monospace; letter-spacing:0.16em; color:rgba(255,255,255,0.5); flex:0 0 auto; }
    /* vote countdown timer (top of the voting screen) */
    .vs-timer { flex:0 0 auto; display:flex; flex-direction:column; gap:6px; padding:0 2px; }
    .vs-timer-head { display:flex; justify-content:flex-start; gap:10px; align-items:baseline; font:700 12px/1 'JetBrains Mono',monospace; letter-spacing:0.14em; color:rgba(255,255,255,0.6); text-transform:uppercase; padding-right:96px; }
    .vs-timer-num { font:800 18px/1 'Space Grotesk',sans-serif; color:#fff; }
    .vs-timer-bar { width:100%; height:8px; border-radius:999px; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.14); overflow:hidden; }
    .vs-timer-bar i { display:block; height:100%; border-radius:999px; background:linear-gradient(90deg, var(--cyan,#00E5FF), #fff, var(--magenta,#FF1A8C)); box-shadow:0 0 14px rgba(255,255,255,0.5); transition:width .25s linear; }
    .vs-grid { flex:1 1 auto; display:flex; gap:10px; min-height:0; }
    .vs-btn {
      flex:1 1 0; min-width:0; position:relative; overflow:hidden;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
      padding:26px 10px 56px; border:2px solid var(--c); border-radius:26px; background:#0b0b12;
      color:#fff; cursor:pointer; -webkit-tap-highlight-color:transparent; user-select:none; touch-action:none;
      transition:box-shadow .15s ease, transform .06s ease;
    }
    .vs-fill {
      position:absolute; left:0; right:0; bottom:0; z-index:0; height:50%;
      background:linear-gradient(180deg, transparent, var(--c)); opacity:0.34;
      transition:height .3s cubic-bezier(.25,.9,.3,1);
    }
    .vs-btn > span:not(.vs-fill) { position:relative; z-index:1; }
    .vs-btn.lead { box-shadow:0 0 38px -6px var(--c); }
    .vs-btn:active { transform:scale(0.985); box-shadow:0 0 64px -4px var(--c); }
    .vs-genre { font:900 clamp(16px,6vw,27px)/1.05 'Archivo','Space Grotesk',sans-serif; text-transform:uppercase; color:var(--c); text-align:center; }
    .vs-pct { font:800 60px/1 'Space Grotesk',sans-serif; color:#fff; text-shadow:0 0 18px rgba(0,0,0,0.5); }
    .vs-pct i { font-size:22px; opacity:0.5; font-style:normal; margin-left:2px; }
    .vs-cta { position:absolute; bottom:18px; left:0; right:0; z-index:1; display:flex; align-items:center; justify-content:center; gap:7px; transform:translateY(8px); font:700 11px/1 'JetBrains Mono',monospace; letter-spacing:0.12em; color:rgba(255,255,255,0.6); }
    .vs-dot { width:8px; height:8px; border-radius:50%; background:var(--c); box-shadow:0 0 8px var(--c); animation:vspulse 1.1s ease-in-out infinite; }
    @keyframes vspulse { 0%,100%{opacity:.4; transform:scale(.85);} 50%{opacity:1; transform:scale(1.15);} }

    /* VOTE HOLD: shown after you lock in your intent but before the big screen
       opens the battle — keeps the phone in lockstep with the stage. */
    .vs-hold { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:18px; padding:32px 24px; }
    .vs-hold .vs-dot { --c:#2dd36f; display:inline-block; margin-right:8px; vertical-align:middle; }
    .vs-hold-k { font:700 12px/1 'JetBrains Mono',monospace; letter-spacing:0.22em; color:#2dd36f; }
    .vs-hold-title { font:800 30px/1.05 'Space Grotesk',sans-serif; color:#fff; letter-spacing:0.01em; }
    .vs-hold-vs { display:flex; flex-direction:column; align-items:center; gap:4px; font:900 26px/1.05 'Space Grotesk',sans-serif; text-transform:uppercase; }
    .vs-hold-vs em { font:700 13px/1 'JetBrains Mono',monospace; font-style:normal; letter-spacing:0.18em; color:rgba(255,255,255,0.4); }
    .vs-hold-sub { font:600 13px/1 'JetBrains Mono',monospace; letter-spacing:0.1em; color:rgba(255,255,255,0.4); }
    .bs-dots { animation:bsdots 1.4s ease-in-out infinite; }
    @keyframes bsdots { 0%,100%{opacity:.25;} 50%{opacity:1;} }

    /* Q2 ("What's <NAME>'s song about?"): center the input vertically so it isn't
       stranded at the top with a big empty gap (and sits nearer the thumb/keyboard). */
    .screen.intent { display:flex; flex-direction:column; }
    .screen.intent .intent-head { flex:0 0 auto; }
    .screen.intent .intent-box-wrap { margin-top:auto; margin-bottom:auto; }
    .screen.intent .intent-foot { flex:0 0 auto; }

    /* ---- Real mobile: drop the simulated-iPhone frame, fill the actual screen,
       and respect the device notch / home-indicator safe areas. ---- */
    #stage.stage-bare { display:block; padding:0; }
    .stage-bare .phone {
      position:fixed; inset:0; height:100dvh; box-sizing:border-box;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
    }

    /* ---- Playlist link opened on DESKTOP: present the saved set as a real web
       page (full-bleed venue backdrop + a centered, comfortably-wide column),
       not the simulated-iPhone preview used by the live join flow. ---- */
    #stage.playlist-web {
      position:fixed; inset:0; overflow-y:auto; display:flex;
      justify-content:center; align-items:flex-start;
      background:
        linear-gradient(180deg, rgba(7,7,11,0.85), rgba(7,7,11,0.94)),
        url('assets/lobby-bg.jpg') center / cover no-repeat fixed,
        #07070B;
    }
    .playlist-web .playlist-web-col {
      position:relative; width:100%; max-width:540px; min-height:100dvh;
      box-shadow:0 0 120px rgba(0,0,0,0.55);
    }
    .playlist-web .phone { position:relative; height:auto; min-height:100dvh; }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
      <rect width="100" height="100" fill="#0A0A0F"/>
      <circle cx="50" cy="50" r="26" fill="none" stroke="#00E5FF" stroke-width="5" stroke-dasharray="100 64" stroke-linecap="round" transform="rotate(-90 50 50)"/>
      <circle cx="50" cy="50" r="13" fill="#FF1A8C"/>
    </svg>
  </template>

  <!-- React + Babel (same CDN + integrity as the partner's prototype) -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- LIVE transport + NETWORKED seams (replace crowd-sim.js / tug-sim.js).
       net.js MUST load first; the net-* seams define window.CrowdSim /
       window.Tug BEFORE app.jsx runs, so the UI binds to the wire. -->
  <script src="net.js"></script>
  <script src="net-crowd.js"></script>
  <script src="net-tug.js"></script>

  <!-- partner components (UNCHANGED) + OUR linear shell (replaces app.jsx).
       phone-shell.jsx sequences the partner's screens like a form instead of
       the swipeable-tab deck. -->
  <script type="text/babel" src="ios-frame.jsx"></script>
  <script type="text/babel" src="shared.jsx?v=9"></script>
  <script type="text/babel" src="screen-vibe.jsx?v=7"></script>
  <script type="text/babel" src="screen-texture.jsx?v=12"></script>
  <script type="text/babel" src="screen-tug.jsx?v=7"></script>
  <script type="text/babel" src="screen-intent.jsx?v=14"></script>
  <!-- merged from design-handoff: the end-of-set recap (playlist player) -->
  <script src="setlist.js?v=1"></script>
  <script type="text/babel" src="screen-recap.jsx?v=2"></script>
  <script type="text/babel" src="phone-shell.jsx?v=14"></script>

  <!-- phone glue: join (NAME) + answer (INTENT). Loaded LAST.
       Plain vanilla JS (no Babel) — net.js/net-crowd.js are plain scripts
       above it so its CrowdSim.addWord patch applies immediately; the
       IntentSink wrap retries until screen-intent.jsx's Babel module runs. -->
  <script src="phone-net.js?v=7"></script>
</body>
</html>
